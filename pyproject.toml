[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "omapack"
version = "0.1.0.dev0"
description = "Review-first source package management for Omarchy plugins"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Silouan Wright", email = "hello@silouan.io" }]
dependencies = []

[project.scripts]
omapack = "omapack.cli:main"

[tool.setuptools]
packages = ["omapack"]
