[package]
name = "qmlpack"
version = "0.1.0-dev"
edition = "2024"
rust-version = "1.88"
description = "Review-first source package management for Omarchy plugins"
license = "MIT"
repository = "https://github.com/silouanwright/qmlpack"

[dependencies]
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
similar = "2.7"
tempfile = "3.20"
unicode-normalization = "0.1"
unicode-casefold = "0.2"

[profile.release]
strip = true
lto = "thin"
